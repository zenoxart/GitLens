name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw
        shell: bash

      - name: Build runnable jar
        run: ./mvnw -B -Pdist package
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitlens-${{ matrix.artifact }}
          path: target/gitlens-*.jar
          if-no-files-found: error
